[project]
name = "minimal-openopps-plugin"
version = "0.1.0"
description = "Minimal OpenOpps plugin template for v0.1 extension points."
requires-python = ">=3.12"
dependencies = ["openopps>=0.1.0"]

[project.entry-points."openopps.plugins"]
minimal = "minimal_openopps_plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimal_openopps_plugin"]
