[project]
name = "openopps"
version = "0.1.0"
description = "High-performance CLI for discovering opportunity boards and fetching public job postings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "faker>=40.18.0",
  "httpx[http2]>=0.28",
  "loguru>=0.7",
  "polars>=1.30",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
  "sqlmodel>=0.0.38",
  "tenacity>=9.0",
  "typer>=0.16",
]

[project.scripts]
openopps = "openopps.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openopps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "hypothesis>=6.152.9",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
]
