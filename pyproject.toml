[project]
name = "openopps"
version = "0.1.0"
description = "High-performance CLI for discovering opportunity boards and fetching public job postings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.4",
  "click>=8.3",
  "faker>=40.18.0",
  "httpx[http2]>=0.28",
  "idna>=3.10",
  "loguru>=0.7",
  "polars>=1.30",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "rich>=15.0",
  "sqlmodel>=0.0.38",
  "tenacity>=9.0",
  "typer>=0.16",
]

[project.scripts]
openopps = "openopps.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openopps"]

[tool.hatch.build.targets.wheel.force-include]
"examples/examples.py" = "examples/examples.py"
"src/openopps/providers/sources/data/portfolio_source_catalog.json" = "openopps/providers/sources/data/portfolio_source_catalog.json"
"src/openopps/providers/sources/data/source_policy_evidence.json" = "openopps/providers/sources/data/source_policy_evidence.json"
"src/openopps/providers/sources/data/source_policy_evidence.schema.json" = "openopps/providers/sources/data/source_policy_evidence.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: isolated tests for one module or small boundary",
  "integration: cross-module tests with local storage, CLI, or mocked HTTP seams",
  "smoke: fast release-readiness checks for importability and critical wiring",
  "e2e: end-to-end tests against real external boundaries or full user journeys",
]

[tool.coverage.run]
omit = ["src/openopps/main.py"]
source = ["openopps"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/openopps"]

[dependency-groups]
dev = [
  "hypothesis>=6.152.9",
  "pip-audit==2.10.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=7.1.0",
  "respx>=0.22",
  "ruff==0.16.2",
  "ty==0.0.71",
]
ops = [
  "browser-cookie3==0.20.1",
  "kaggle==2.2.4",
  "kagglehub[polars-datasets]==1.0.2",
  "requests==2.34.2",
]
