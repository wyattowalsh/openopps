name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Check uv lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=openopps --cov-report=term-missing

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Show OpenSpec state
        run: npx -y @fission-ai/openspec@1.6.0 list --json

      - name: Validate all changes
        run: npx -y @fission-ai/openspec@1.6.0 validate --all --strict

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras --dev

      # uv lock --check runs in the python job; export resolved deps for CVE scanning.
      - name: Export Python requirements for audit
        run: uv export --frozen --all-extras --dev --no-hashes -o /tmp/requirements-audit.txt

      - name: Audit Python dependencies
        # pip-audit no longer accepts --severity; -r cannot be combined with project_path.
        run: uvx pip-audit -r /tmp/requirements-audit.txt --progress-spinner off

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit web production npm dependencies
        working-directory: web
        run: pnpm audit --prod --audit-level high

  docs:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.2
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Type-check web
        working-directory: web
        run: pnpm types:check

      - name: Build web
        working-directory: web
        run: pnpm build

      - name: Check web API function traces
        run: uv run python scripts/verify_docs_function_trace.py

      - name: Test web
        working-directory: web
        run: pnpm test

      - name: Check committed search index schema
        run: uv run pytest tests/unit/openopps/test_docs_search_index.py -k committed

      - name: Check committed search artifact graph
        run: uv run python scripts/verify_docs_search_artifacts.py --root web/public/data/openopps-search --require-git-tracked

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser-test web
        working-directory: web
        env:
          OPENOPPS_E2E_WEB_SERVER_COMMAND: pnpm exec next start -p 3211
        run: pnpm exec playwright test --project=chromium

      - name: Browser-test web accessibility
        working-directory: web
        env:
          OPENOPPS_E2E_WEB_SERVER_COMMAND: pnpm exec next start -p 3211
        run: pnpm exec playwright test --project=mobile-chromium accessibility.spec.ts

      - name: Lint web
        working-directory: web
        run: pnpm lint

  artifacts:
    name: Generated artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Generate Kaggle metadata
        run: PYTHONPATH=scripts uv run python -m openopps_kaggle

      - name: Kaggle clean-DB bundle smoke
        # Inline Justfile kaggle-bundle-smoke (no just binary on this job).
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          db="$work/openoppsdb.sqlite"
          OPENOPPS_DB_URL="sqlite:///$db" uv run openopps admin db init
          out="$work/kaggle-out"
          mkdir -p "$out"
          if [[ -f web/public/social/openoppsdb.png ]]; then
            cp web/public/social/openoppsdb.png "$out/dataset-cover-image.png"
          elif [[ -f kaggle/dataset-cover-image.png ]]; then
            cp kaggle/dataset-cover-image.png "$out/dataset-cover-image.png"
          fi
          PYTHONPATH=scripts uv run python -m openopps_kaggle --output-dir "$out" --data-db "$db" --skip-notebooks
          stage="$work/stage"
          mkdir -p "$stage"
          PYTHONPATH=scripts uv run python -m openopps_kaggle --output-dir "$out" --stage-public-upload-dir "$stage" --skip-notebooks
          test -f "$stage/openoppsdb.sqlite"
          test -f "$stage/dataset-metadata.json"
          ! test -f "$stage/sync_metrics.json"
          ! test -f "$stage/snapshot-quality.json"

      - name: Smoke CLI help
        run: |
          uv run openopps --no-intro --help > /tmp/openopps-root-help.txt
          uv run openopps sync --help > /tmp/openopps-sync-help.txt
          uv run openopps providers --help > /tmp/openopps-providers-help.txt
          uv run openopps admin providers probe-routes --help > /tmp/openopps-probe-routes-help.txt

      - name: Check diff formatting
        run: git diff --check
