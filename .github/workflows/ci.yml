name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_FROZEN: "1"

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Run coverage
        run: uv run pytest --cov=openopps --cov-report=term-missing

  openspec:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Show OpenSpec state
        run: |
          npx -y @fission-ai/openspec@latest list --json
          npx -y @fission-ai/openspec@latest status --change prepare-v0-1-release --json

      - name: Validate all changes
        run: npx -y @fission-ai/openspec@latest validate --all --strict

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Type-check docs
        working-directory: docs
        run: pnpm types:check

      - name: Build docs
        working-directory: docs
        run: pnpm build

      - name: Lint docs
        working-directory: docs
        run: pnpm lint

  artifacts:
    name: Generated artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Generate Kaggle metadata
        run: uv run python scripts/generate_kaggle_metadata.py

      - name: Smoke CLI help
        run: |
          uv run openopps --no-intro --help > /tmp/openopps-root-help.txt
          uv run openopps sync --help > /tmp/openopps-sync-help.txt
          uv run openopps providers --help > /tmp/openopps-providers-help.txt
          uv run openopps admin providers probe-routes --help > /tmp/openopps-probe-routes-help.txt

      - name: Check diff formatting
        run: git diff --check
